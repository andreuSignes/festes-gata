# Repository settings for festes-gata
#
# Declarative repo settings, applied via the `repository-settings`
# GitHub App (https://github.com/apps/settings). When the app is
# installed on this repo AND has the right scopes, pushes that change
# this file on the default branch are synced to the GitHub REST API.
# Without the app, this file is declarative documentation only.
#
# Convention used in this repo: stacked-to-main with single author
# and squash-merge only. Merge options below enforce that.
#
# Schema reference:
# https://github.com/repository-settings/app/blob/master/docs/configuration.md

repository:
  description: Festes de Gata de Gorgos 2026 — Static site for the festival program (26 Jul → 6 Aug 2026)
  homepage: https://andreuSignes.github.io/festes-gata/
  # Squash-merge only — keeps history linear and one commit per PR.
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_squash_merge: true
  # Auto-merge is useful for Dependabot patch bumps that pass CI.
  # PRs still need an explicit "enable auto-merge" interaction; this
  # just allows the API path. Default commit message for squash is
  # fine for our convention.
  allow_auto_merge: true
  delete_branch_on_merge: true

  # Security defaults — usually on; declaring for explicitness.
  enable_vulnerability_alerts: true
  enable_automated_security_fixes: true

  # Squash-merge default message preference: PR title + body, single
  # paragraph. Matches the convention commits style used in this repo.
  squash_merge_commit_message: PR_BODY
  squash_merge_commit_title: PR_TITLE

# Branch protection: a single protected branch (`main`).
# The repository-settings app expects the schema documented in
# docs/plugins/branches.md of the app repo: every protection
# sub-section must be present (or explicitly null), otherwise the app
# drops the whole block.
branches:
  - name: main
    protection:
      # PR review requirements. Solo maintainer + no CODEOWNERS, so
      # required_approving_review_count is 0 (don't gate on count,
      # gate on the CI check below).
      required_pull_request_reviews:
        required_approving_review_count: 0
        # Keep PR conversations relevant: stale approvals drop on new push.
        dismiss_stale_reviews: true
        # Solo maintainer; no CODEOWNERS gate. The required status
        # check is the gate that keeps main releasable.
        require_code_owner_reviews: false
        # Personal repo → no user/team dismissal restrictions.
        dismissal_restrictions:
          users: []
          teams: []
      # Require the PR validation CI to pass before merging.
      required_status_checks:
        # Require branches to be up to date before merging.
        strict: true
        # Contexts: the job name reported by .github/workflows/ci.yml.
        contexts:
          - Validate PR
      # Apply all of the above to administrators too.
      enforce_admins: true
      # Block merge commits from being pushed — matches the squash-only
      # convention configured in `repository:` above.
      required_linear_history: true
      # No push restrictions (solo maintainer; can't create teams).
      restrictions:
        apps: []
        users: []
        teams: []        

# Labels used across issues and PRs. Kept tiny on purpose: a small set
# is easier to use than an undisciplined taxonomy.
labels:
  - name: bug
    color: d73a4a
    description: Something isn't working
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
  - name: enhancement
    color: a2eeef
    description: New feature or request
  - name: dependencies
    color: 0366d6
    description: Pull requests that update a dependency file
    # Mark Dependabot PRs automatically.
    pullrequest: dependencies
  - name: ci
    color: fbca04
    description: Pull requests that affect CI / GitHub Actions
