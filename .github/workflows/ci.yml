name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    # GitHub reports the status-check context as the **job key** (not the
    # display name). The key MUST match the `contexts:` list in
    # `.github/settings.yml` `required_status_checks.contexts` exactly,
    # otherwise the branch-protection rule silently never matches and
    # `main` can be merged without a passing CI run.
    name: Validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # actions/setup-node v5+ activates automatic package-manager
          # caching when package.json declares a `packageManager` field.
          # We declare `pnpm@11.17.0`, so the action would otherwise try
          # to cache twice and warn. Disable the auto cache to keep the
          # explicit `cache: pnpm` behaviour above.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content (filename + date parity + enum)
        run: pnpm run check:content

      - name: Run tests
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          files: ./coverage/lcov.info
          verbose: true

      - name: Astro check (TypeScript + Astro diagnostics)
        run: pnpm run check

      # Lint and format:check are intentionally out of scope for this PR.
      # The repo has 4 pre-existing ESLint parsing errors on .astro files
      # (DayCard, EventItem, BaseLayout, programa/[date]) and 2 Prettier
      # warnings on AGENTS.md and src/styles/global.css. Per the repo's
      # standing rule, those are addressed in a dedicated follow-up PR,
      # not by widening the CI scope here. Once that PR lands, re-add
      # `pnpm run lint` and `pnpm run format:check` steps in order.
      - name: Build (Zod schemas + static generation)
        run: pnpm run build
