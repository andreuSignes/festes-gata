name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    # GitHub reports the status-check context as the **job key** (not the
    # display name). The key MUST match the `contexts:` list in
    # `.github/settings.yml` `required_status_checks.contexts` exactly,
    # otherwise the branch-protection rule silently never matches and
    # `main` can be merged without a passing CI run.
    name: Validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # actions/setup-node v5+ activates automatic package-manager
          # caching when package.json declares a `packageManager` field.
          # We declare `pnpm@11.17.0`, so the action would otherwise try
          # to cache twice and warn. Disable the auto cache to keep the
          # explicit `cache: pnpm` behaviour above.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content (filename + date parity + enum)
        run: pnpm run check:content

      - name: Lint
        # `eslint-plugin-security` reports insecure patterns as
        # warnings; we treat them as informational here so a single
        # legacy sink doesn't block green CI. Move to errors in a
        # follow-up once the warnings are confirmed-and-suppressed.
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Audit (production deps)
        # `--prod` excludes devDependencies; `--audit-level` only fails
        # on moderate/high/critical advisories. `pnpm audit` runs
        # against the npm Advisory DB and is the cheapest CVE gate
        # available without depending on Dependabot's weekly cadence.
        run: pnpm audit --prod --audit-level=moderate

      - name: Run tests
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          files: ./coverage/lcov.info
          verbose: true

      - name: Astro check (TypeScript + Astro diagnostics)
        run: pnpm run check

      - name: Build (Zod schemas + static generation)
        run: pnpm run build
