# pnpm 11 project configuration.
#
# In pnpm v11 the project-structural settings previously kept in
# `package.json#pnpm` (onlyBuiltDependencies, auto-install-peers,
# strict-peer-dependencies, etc.) and in `.npmrc` moved here. See
# https://pnpm.io/migration and https://pnpm.io/settings.
#
# onlyBuiltDependencies → allowBuilds (map: package-name: true|false)
# `esbuild` is the native binary Vite/Astro load at runtime; it MUST
# be allowed to run its postinstall script. `workerd` was previously
# pulled in transitively by the (now removed) `wrangler` devDep and
# is no longer needed.
allowBuilds:
  esbuild: true

# Peer-dep ergonomics compatible with Astro 7.
autoInstallPeers: true
strictPeerDependencies: false
